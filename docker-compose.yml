# Local development stack for the chat server.
#
#   docker compose up -d --build
#   open http://localhost:8080
#
# Only the load balancer is published to the host. Everything else is reachable
# only inside the compose network.

name: chat

x-app-env: &app-env
  RUST_LOG: ${RUST_LOG:-info}
  # Development default. Set a real secret through the environment for anything shared.
  JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
  DATABASE_URL: postgres://chat:chat@postgres:5432/chat
  REDIS_URL: redis://redis:6379
  NATS_URL: nats://nats:4222
  KAFKA_BROKERS: kafka:9092
  SCYLLA_NODES: scylla:9042

x-chat-service: &chat-service
  image: chat/chat-service:dev
  build:
    context: .
    target: chat-service
  restart: unless-stopped
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
    nats: { condition: service_healthy }
    kafka-init: { condition: service_completed_successfully }
    scylla-init: { condition: service_completed_successfully }

x-gateway: &gateway
  image: chat/gateway:dev
  build:
    context: .
    target: gateway
  restart: unless-stopped
  # Longer than the gateway's own drain deadline, so connections can move away.
  stop_grace_period: 15s
  depends_on:
    redis: { condition: service_healthy }
    nats: { condition: service_healthy }
    chat-service-1: { condition: service_started }
    chat-service-2: { condition: service_started }

services:
  # ---------------------------------------------------------------- entry point
  # Load balancer. Serves the test page, spreads WebSocket connections over the
  # gateways and REST calls over the chat services.
  lb:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./web:/usr/share/nginx/html:ro
    depends_on:
      - gateway-1
      - gateway-2
      - chat-service-1
      - chat-service-2

  # ----------------------------------------------------------- connection layer
  gateway-1:
    <<: *gateway
    environment:
      <<: *app-env
      GATEWAY_ID: gateway-1
      CHAT_SERVICE_ADDRS: http://chat-service-1:50051,http://chat-service-2:50051

  gateway-2:
    <<: *gateway
    environment:
      <<: *app-env
      GATEWAY_ID: gateway-2
      CHAT_SERVICE_ADDRS: http://chat-service-1:50051,http://chat-service-2:50051

  # ---------------------------------------------------------------- logic layer
  # NODE_ID must differ per instance: it is part of every message id.
  chat-service-1:
    <<: *chat-service
    environment:
      <<: *app-env
      NODE_ID: "1"

  chat-service-2:
    <<: *chat-service
    environment:
      <<: *app-env
      NODE_ID: "2"

  # -------------------------------------------------------------------- workers
  persist-worker:
    image: chat/persist-worker:dev
    build:
      context: .
      target: persist-worker
    restart: unless-stopped
    environment:
      <<: *app-env
    depends_on:
      kafka-init: { condition: service_completed_successfully }
      scylla-init: { condition: service_completed_successfully }

  push-worker:
    image: chat/push-worker:dev
    build:
      context: .
      target: push-worker
    restart: unless-stopped
    environment:
      <<: *app-env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }

  # --------------------------------------------------------------- realtime bus
  nats:
    image: nats:2.10-alpine
    restart: unless-stopped
    command: ["-m", "8222"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ---------------------------------------------------------------- durable log
  kafka:
    image: apache/kafka:3.9.0
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  # Creates the topic once, then exits.
  kafka-init:
    image: apache/kafka:3.9.0
    restart: "no"
    depends_on:
      kafka: { condition: service_healthy }
    entrypoint: ["/bin/bash", "-c"]
    command:
      - >
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092
        --create --if-not-exists --topic chat.messages
        --partitions 6 --replication-factor 1

  # ----------------------------------------------------------------- data stores
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: chat
      POSTGRES_PASSWORD: chat
      POSTGRES_DB: chat
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./deploy/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chat -d chat"]
      interval: 5s
      timeout: 3s
      retries: 10

  scylla:
    image: scylladb/scylla:6.2
    restart: unless-stopped
    # Small footprint for a laptop. Not production settings.
    command: ["--smp", "1", "--memory", "750M", "--overprovisioned", "1", "--developer-mode", "1"]
    volumes:
      - scylla-data:/var/lib/scylla
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'SELECT now() FROM system.local' >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 40s

  # Creates the keyspace and table once, then exits.
  scylla-init:
    image: scylladb/scylla:6.2
    restart: "no"
    depends_on:
      scylla: { condition: service_healthy }
    volumes:
      - ./deploy/scylla/init.cql:/init.cql:ro
    entrypoint: ["cqlsh", "scylla", "-f", "/init.cql"]

volumes:
  kafka-data:
  redis-data:
  postgres-data:
  scylla-data:
