# 2단계: 채팅 서버 옆에 PostgreSQL 하나를 띄운다.
# 채팅 서버 자체는 여전히 cargo run 으로 돌린다. 여기에는 DB 만 있다.
#
#   docker compose up -d     DB 켜기
#   docker compose down      DB 끄기 (데이터는 남는다)
#   docker compose down -v   DB 끄고 데이터까지 지우기
services:
  postgres:
    image: postgres:16
    environment:
      # 내 컴퓨터에서만 쓰는 연습용 계정이다. 실제 서비스에서는 이렇게 적어 두지 않는다.
      POSTGRES_USER: chat
      POSTGRES_PASSWORD: chat
      POSTGRES_DB: chat
    ports:
      # 내 컴퓨터의 5432 포트로 들어온 연결을 컨테이너의 5432 로 넘긴다.
      # 127.0.0.1 을 붙여 내 컴퓨터 밖에서는 접속하지 못하게 한다.
      - "127.0.0.1:5432:5432"
    volumes:
      # 데이터를 컨테이너 밖(pgdata 라는 이름의 저장 공간)에 둔다.
      # 그래야 컨테이너를 껐다 켜도 데이터가 남는다.
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
