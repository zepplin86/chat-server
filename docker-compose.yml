# 게이트웨이와 채팅 서버 둘레에 필요한 것들: PostgreSQL, 로드밸런서, NATS.
# 게이트웨이와 채팅 서버 자체는 cargo run 으로 돌린다.
#
#   docker compose up -d     켜기
#   docker compose down      끄기 (데이터는 남는다)
#   docker compose down -v   끄고 데이터까지 지우기
services:
  # 로드밸런서. 브라우저는 여기(8080)로 들어온다.
  # 여기서 주소를 보고 게이트웨이(8081, 8082)나 채팅 서버(8090)로 넘긴다.
  lb:
    image: nginx:1.27
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      # 설정 파일을 컨테이너 안에 넣어 준다. ro 는 읽기만 한다는 뜻.
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    extra_hosts:
      # 컨테이너 안에서 host.docker.internal 이라는 이름으로 내 컴퓨터를 찾을 수 있게 한다.
      # (Mac 에서는 없어도 되지만 Linux 에서는 이 줄이 있어야 한다)
      - "host.docker.internal:host-gateway"

  # NATS. 채팅 서버에서 게이트웨이들로 메시지를 날라 준다.
  # 채팅 서버가 여기에 메시지를 내보내면, 듣고 있는 모든 게이트웨이가 받는다.
  nats:
    image: nats:2.10-alpine
    ports:
      # 게이트웨이와 채팅 서버가 접속하는 포트.
      - "127.0.0.1:4222:4222"

  postgres:
    image: postgres:16
    environment:
      # 내 컴퓨터에서만 쓰는 연습용 계정이다. 실제 서비스에서는 이렇게 적어 두지 않는다.
      POSTGRES_USER: chat
      POSTGRES_PASSWORD: chat
      POSTGRES_DB: chat
    ports:
      # 내 컴퓨터의 5432 포트로 들어온 연결을 컨테이너의 5432 로 넘긴다.
      # 127.0.0.1 을 붙여 내 컴퓨터 밖에서는 접속하지 못하게 한다.
      - "127.0.0.1:5432:5432"
    volumes:
      # 데이터를 컨테이너 밖(pgdata 라는 이름의 저장 공간)에 둔다.
      # 그래야 컨테이너를 껐다 켜도 데이터가 남는다.
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
