# 로드밸런서(nginx) 설정.
# 로드밸런서는 들어온 사람을 서버 여러 대에 나눠 보내는 문지기다.
# 브라우저는 문지기의 주소 하나만 알면 되고, 뒤에 서버가 몇 대인지, 몇 종류인지 몰라도 된다.
#
# 뒤에는 이제 두 종류가 있다. 문지기는 요청의 주소를 보고 어느 쪽으로 보낼지 정한다.
#   /login, /rooms...  → 채팅 서버 (로직 담당)
#   그 밖 (화면, /ws)  → 게이트웨이 (연결 담당)

# 게이트웨이들. 한 대가 꺼져 있으면 건너뛰고 켜져 있는 쪽으로 보낸다.
upstream gateways {
    # 누구에게 보낼지 고르는 방법: 지금 맺혀 있는 연결이 가장 적은 쪽으로 보낸다.
    # 오래 붙어 있는 WebSocket 이 한쪽에 몰리지 않게 하려면, 요청의 수가 아니라 붙어 있는 연결의 수를 세어야 한다.
    least_conn;

    # nginx 는 일꾼(worker) 프로세스 여러 개가 접속을 나눠 받는다.
    # 일꾼마다 "어디에 연결이 몇 개인지"를 따로 세면, 저마다 "둘 다 0개네" 하고 같은 쪽을 고른다.
    # zone 은 그 숫자를 일꾼들이 함께 보는 메모리에 두게 한다. 그래야 위의 least_conn 이 제대로 센다.
    # (gateways 는 그 메모리의 이름, 64k 는 크기다)
    zone gateways 64k;

    # host.docker.internal 은 "이 컨테이너를 돌리고 있는 내 컴퓨터"를 가리키는 이름이다.
    # 게이트웨이는 컨테이너 밖(내 컴퓨터)에서 cargo run 으로 돌고 있기 때문에 이렇게 찾아간다.
    server host.docker.internal:8081;
    server host.docker.internal:8082;
}

# 채팅 서버. 지금은 한 대다.
upstream chat_server {
    server host.docker.internal:8090;
}

server {
    # 컨테이너 안에서는 80 포트로 듣는다. docker-compose.yml 이 내 컴퓨터의 8080 을 여기로 잇는다.
    listen 80;

    # 로그인과 방에 관한 요청은 채팅 서버로 보낸다.
    # 한 번 묻고 답하면 끝나는 요청들이다. 붙들고 있을 연결이 없으므로 게이트웨이를 거칠 이유가 없다.
    # "location /rooms" 는 /rooms 로 시작하는 주소 전부에 맞는다. (/rooms/1/messages 도)
    location /login {
        proxy_pass http://chat_server;
    }
    location /rooms {
        proxy_pass http://chat_server;
    }

    # 그 밖의 전부(화면과 WebSocket)는 게이트웨이로 보낸다.
    location / {
        proxy_pass http://gateways;

        # 아래 세 줄은 WebSocket 을 위한 것이다.
        # WebSocket 은 보통의 요청으로 시작해서 "통로로 바꾸자"(Upgrade)고 청한다.
        # nginx 는 이 청을 뒤로 넘겨주지 않는 것이 기본이라, 넘기라고 적어 줘야 한다.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # nginx 는 60초 동안 아무것도 오가지 않으면 연결을 끊는 것이 기본이다.
        # 채팅은 한동안 조용할 수 있으므로 1시간으로 늘린다.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}
