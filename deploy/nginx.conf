# 로드밸런서(nginx) 설정.
# 로드밸런서는 들어온 사람을 서버 여러 대에 나눠 보내는 문지기다.
# 브라우저는 문지기의 주소 하나만 알면 되고, 뒤에 서버가 몇 대인지 몰라도 된다.

# 뒤에 있는 채팅 서버들. 한 대가 꺼져 있으면 건너뛰고 켜져 있는 쪽으로 보낸다.
upstream chat_servers {
    # 누구에게 보낼지 고르는 방법: 지금 맺혀 있는 연결이 가장 적은 서버로 보낸다.
    #
    # 이 줄이 없으면 요청이 들어온 순서대로 번갈아 보낸다. (1번, 2번, 1번, 2번...)
    # 그 방법은 채팅에 맞지 않았다. 한 사람이 "로그인 요청 → WebSocket 접속" 을 차례로 하면
    # 로그인은 늘 1번, WebSocket 은 늘 2번으로 가서, 오래 붙어 있는 WebSocket 이 한 서버에만 몰렸다.
    # 요청의 수가 아니라 붙어 있는 연결의 수를 세어야 고르게 나뉜다.
    least_conn;

    # nginx 는 일꾼(worker) 프로세스 여러 개가 접속을 나눠 받는다.
    # 일꾼마다 "어느 서버에 연결이 몇 개인지"를 따로 세면, 저마다 "둘 다 0개네" 하고 같은 서버를 고른다.
    # zone 은 그 숫자를 일꾼들이 함께 보는 메모리에 두게 한다. 그래야 위의 least_conn 이 제대로 센다.
    # (chat_servers 는 그 메모리의 이름, 64k 는 크기다)
    zone chat_servers 64k;

    # host.docker.internal 은 "이 컨테이너를 돌리고 있는 내 컴퓨터"를 가리키는 이름이다.
    # 채팅 서버는 컨테이너 밖(내 컴퓨터)에서 cargo run 으로 돌고 있기 때문에 이렇게 찾아간다.
    server host.docker.internal:8081;
    server host.docker.internal:8082;
}

server {
    # 컨테이너 안에서는 80 포트로 듣는다. docker-compose.yml 이 내 컴퓨터의 8080 을 여기로 잇는다.
    listen 80;

    location / {
        # 받은 요청을 위의 서버들 중 하나로 넘긴다.
        proxy_pass http://chat_servers;

        # 아래 세 줄은 WebSocket 을 위한 것이다.
        # WebSocket 은 보통의 요청으로 시작해서 "통로로 바꾸자"(Upgrade)고 청한다.
        # nginx 는 이 청을 뒤로 넘겨주지 않는 것이 기본이라, 넘기라고 적어 줘야 한다.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # nginx 는 60초 동안 아무것도 오가지 않으면 연결을 끊는 것이 기본이다.
        # 채팅은 한동안 조용할 수 있으므로 1시간으로 늘린다.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}
