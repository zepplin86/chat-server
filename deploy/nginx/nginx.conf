# Development load balancer.
# Production would put an L4 balancer in front of the gateways instead.

upstream gateways {
    # Shared between nginx workers; without it each worker counts connections on its own.
    zone gateways 64k;
    least_conn;
    server gateway-1:8080;
    server gateway-2:8080;
}

upstream chat_api {
    server chat-service-1:8081;
    server chat-service-2:8081;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    location = /ws {
        proxy_pass http://gateways;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Clients ping every 25s, so an idle connection never reaches this.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        # If one gateway is draining or down, try the other.
        proxy_next_upstream error timeout http_503;
    }

    location /api/ {
        proxy_pass http://chat_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        add_header Cache-Control "no-store";
    }
}
