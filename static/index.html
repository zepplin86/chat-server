<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>채팅 3단계</title>
<style>
  body { font: 15px/1.5 system-ui, sans-serif; max-width: 560px; margin: 24px auto; padding: 0 16px; }
  #status, #hint { color: #64748b; font-size: 13px; }
  #older { margin-top: 10px; width: 100%; }
  #messages { border: 1px solid #cbd5e1; border-radius: 8px; height: 360px; overflow-y: auto; padding: 10px; margin: 10px 0; }
  #roomList { margin: 10px 0; display: flex; flex-direction: column; gap: 6px; }
  #roomList button { text-align: left; }
  #roomBar { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
  #roomName { font-weight: 600; flex: 1; }
  .who { font-weight: 600; }
  .seq { color: #999; font-size: 12px; }
  form { display: flex; gap: 6px; }
  input { flex: 1; font: inherit; padding: 6px 10px; }
  button { font: inherit; padding: 6px 14px; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<h1>채팅 3단계</h1>
<div id="status">연결 안 됨</div>

<!-- 화면 1: 처음에는 이름과 비밀번호를 묻는다 -->
<div id="login">
  <form id="loginForm">
    <input id="name" placeholder="이름" maxlength="32" required autofocus>
    <input id="password" type="password" placeholder="비밀번호 (4자 이상)" required>
    <button>들어가기</button>
  </form>
  <div id="hint">처음 쓰는 이름이면 그 비밀번호로 계정이 만들어집니다.</div>
</div>

<!-- 화면 2: 로그인하면 방 목록이 나온다 -->
<div id="rooms" class="hidden">
  <div id="roomList"></div>
  <form id="roomForm">
    <input id="newRoom" placeholder="새 방 이름" maxlength="32" required>
    <button>방 만들기</button>
  </form>
</div>

<!-- 화면 3: 방을 고르면 대화 화면이 나온다 -->
<div id="chat" class="hidden">
  <div id="roomBar">
    <span id="roomName"></span>
    <button id="leave" type="button">방 목록으로</button>
  </div>
  <button id="older" type="button">이전 대화 더 보기</button>
  <div id="messages"></div>
  <form id="sendForm">
    <input id="body" placeholder="메시지 입력" autocomplete="off">
    <button>보내기</button>
  </form>
</div>

<script>
const $ = (id) => document.getElementById(id);
let ws;
// 지금 들어가 있는 방. {id, name} 모양이다.
let currentRoom;

// 메시지 하나를 화면에 그린다. WebSocket 으로 온 것도, "이전 대화 더 보기"로 받은 것도 여기로 온다.
// 메시지는 {"seq": 순번, "name": 보낸 사람, "body": 내용} 모양이다.
// 순번은 DB 가 매긴 번호다. 도착한 순서가 아니라 이 번호를 믿는다.
// 순번은 모든 방이 함께 쓰므로, 한 방 안에서는 번호가 건너뛸 수 있다. 순서만 맞으면 된다.
function addMessage(message) {
  // 같은 순번을 이미 그렸으면 버린다. (접속하는 순간에는 같은 메시지가 두 번 올 수 있다)
  if ($('m' + message.seq)) return;

  const row = document.createElement('div');
  row.id = 'm' + message.seq;
  row.dataset.seq = message.seq;
  const seq = document.createElement('span');
  seq.className = 'seq';
  seq.textContent = '#' + message.seq + ' ';
  const who = document.createElement('span');
  who.className = 'who';
  who.textContent = message.name + ': ';
  row.append(seq, who, message.body);

  // 순번이 더 큰 줄이 이미 있으면 그 앞에 끼워 넣는다. 없으면 맨 아래에 붙인다.
  // 이전 대화는 맨 위로, 새 메시지는 맨 아래로 간다. 어느 쪽이든 이 한 줄이 제자리를 찾는다.
  const later = [...$('messages').children].find((other) => Number(other.dataset.seq) > message.seq);
  $('messages').insertBefore(row, later ?? null);
}

// 세 화면(login, rooms, chat) 중 하나만 보여 준다.
function show(view) {
  for (const id of ['login', 'rooms', 'chat']) {
    $(id).classList.toggle('hidden', id !== view);
  }
}

// 입장권을 버리고 로그인 화면으로 돌아간다.
function showLogin(message) {
  sessionStorage.clear();
  $('status').textContent = message;
  show('login');
}

// 입장권을 머리말(header)에 실어 서버에 요청한다. 로그인 뒤의 모든 요청이 이 함수를 거친다.
// 서버가 입장권을 받아 주지 않으면(401) 로그인 화면으로 돌아가고 null 을 돌려준다.
async function api(path, options = {}) {
  const response = await fetch(path, {
    ...options,
    headers: {
      'Content-Type': 'application/json',
      'Authorization': 'Bearer ' + sessionStorage.getItem('token'),
    },
  });
  if (response.status === 401) {
    showLogin('다시 로그인해 주세요');
    return null;
  }
  return response;
}

// 이름과 비밀번호를 서버에 보내 확인받는다. 맞으면 서버가 입장권(token)을 준다.
$('loginForm').onsubmit = async (event) => {
  event.preventDefault();
  const response = await fetch('/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name: $('name').value.trim(), password: $('password').value }),
  });
  const result = await response.json();
  $('password').value = '';
  if (!response.ok) {
    $('status').textContent = result.error;
    return;
  }
  // 입장권을 이 탭에 보관한다. 새로고침해도 남고, 탭을 닫으면 사라진다.
  // 비밀번호는 보관하지 않는다. 이 뒤로는 입장권만 쓴다.
  sessionStorage.setItem('token', result.token);
  sessionStorage.setItem('name', result.name);
  showRooms();
};

// 서버에서 방 목록을 받아 와 방마다 버튼을 하나씩 만든다.
async function showRooms(message) {
  const response = await api('/rooms');
  if (!response) return;
  const rooms = await response.json();

  $('roomList').replaceChildren();
  for (const room of rooms) {
    const button = document.createElement('button');
    button.type = 'button';
    button.textContent = room.name;
    // 버튼을 누르면 그 방으로 들어간다.
    button.onclick = () => connect(room);
    $('roomList').append(button);
  }
  $('status').textContent = message ?? `${sessionStorage.getItem('name')} (으)로 로그인됨. 들어갈 방을 고르세요`;
  show('rooms');
}

// 새 방을 만들고 목록을 다시 받아 온다.
$('roomForm').onsubmit = async (event) => {
  event.preventDefault();
  const response = await api('/rooms', {
    method: 'POST',
    body: JSON.stringify({ name: $('newRoom').value.trim() }),
  });
  if (!response) return;
  if (!response.ok) {
    $('status').textContent = (await response.json()).error;
    return;
  }
  $('newRoom').value = '';
  showRooms();
};

// 방 하나에 WebSocket 으로 접속한다. 입장권과 방 번호를 주소 뒤에 붙여 보낸다.
// 연결 하나는 방 하나에만 들어간다.
function connect(room) {
  const token = sessionStorage.getItem('token');
  const name = sessionStorage.getItem('name');
  let opened = false;

  const socket = new WebSocket(`ws://${location.host}/ws?token=${encodeURIComponent(token)}&room=${room.id}`);
  ws = socket;

  // 연결되면 대화 화면으로 바꾼다.
  socket.onopen = () => {
    opened = true;
    $('status').textContent = `${name} (으)로 연결됨`;
    currentRoom = room;
    $('roomName').textContent = room.name;
    $('messages').replaceChildren();
    $('older').classList.remove('hidden');
    show('chat');
    $('body').focus();
  };

  // 서버가 메시지를 보내 줄 때마다 화면에 한 줄 추가하고, 맨 아래가 보이게 내린다.
  socket.onmessage = (event) => {
    const message = JSON.parse(event.data);
    // 접속하자마자 서버가 자기 이름표를 알려 준다. 예: {"server": "8081"}
    // 대화가 아니라 안내이므로 그리지 않고 상태 줄에만 적는다.
    if (message.server) {
      $('status').textContent = `${name} (으)로 연결됨 · 서버 ${message.server}`;
      return;
    }
    addMessage(message);
    $('messages').scrollTop = $('messages').scrollHeight;
  };

  socket.onclose = () => {
    // 이미 다른 방으로 옮겼거나 방 목록으로 나갔으면 아무것도 하지 않는다.
    if (ws !== socket) return;
    if (opened) {
      // 대화하던 중에 끊겼다. (아직 자동 재접속이 없다)
      $('status').textContent = '연결 끊김. 새로고침하면 다시 접속합니다';
    } else {
      // 한 번도 연결되지 못했다. 방 목록을 다시 받아 본다.
      // 입장권이 문제였다면 그 요청이 401 을 받아 로그인 화면으로 간다.
      showRooms('방에 들어가지 못했습니다');
    }
  };
}

// 방 목록으로 돌아간다. 지금 방의 연결은 끊는다.
$('leave').onclick = () => {
  const socket = ws;
  ws = null;
  socket.close();
  showRooms();
};

// 화면에 있는 가장 오래된 메시지보다 앞의 대화를 한 묶음 받아 와 위에 붙인다.
$('older').onclick = async () => {
  const oldest = $('messages').firstElementChild;
  // 화면에 메시지가 하나도 없으면 이 방에는 대화가 없는 것이다.
  if (!oldest) {
    $('older').classList.add('hidden');
    return;
  }
  const response = await api(`/rooms/${currentRoom.id}/messages?before=${oldest.dataset.seq}`);
  if (!response) return;
  const messages = await response.json();

  // 더 받을 것이 없으면 버튼을 감춘다.
  if (messages.length === 0) {
    $('older').classList.add('hidden');
    return;
  }

  // 위에 줄이 붙으면 보던 내용이 아래로 밀린다. 늘어난 높이만큼 내려서 보던 자리를 지킨다.
  const before = $('messages').scrollHeight;
  for (const message of messages) addMessage(message);
  $('messages').scrollTop += $('messages').scrollHeight - before;
};

// 보내기를 누르면 입력한 글을 서버로 보낸다.
$('sendForm').onsubmit = (event) => {
  event.preventDefault();
  const body = $('body').value.trim();
  if (!body || !ws || ws.readyState !== WebSocket.OPEN) return;
  ws.send(body);
  $('body').value = '';
};

// 페이지를 열었을 때 보관해 둔 입장권이 있으면 로그인 없이 바로 방 목록으로 간다.
if (sessionStorage.getItem('token')) showRooms();
</script>
</body>
</html>
