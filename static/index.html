<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>채팅 2단계</title>
<style>
  body { font: 15px/1.5 system-ui, sans-serif; max-width: 560px; margin: 24px auto; padding: 0 16px; }
  #status, #hint { color: #64748b; font-size: 13px; }
  #messages { border: 1px solid #cbd5e1; border-radius: 8px; height: 360px; overflow-y: auto; padding: 10px; margin: 10px 0; }
  .who { font-weight: 600; }
  .seq { color: #999; font-size: 12px; }
  form { display: flex; gap: 6px; }
  input { flex: 1; font: inherit; padding: 6px 10px; }
  button { font: inherit; padding: 6px 14px; }
  .hidden { display: none; }
</style>
</head>
<body>
<h1>채팅 2단계</h1>
<div id="status">연결 안 됨</div>

<!-- 처음에는 이름과 비밀번호를 묻는다 -->
<form id="loginForm">
  <input id="name" placeholder="이름" maxlength="32" required autofocus>
  <input id="password" type="password" placeholder="비밀번호 (4자 이상)" required>
  <button>들어가기</button>
</form>
<div id="hint">처음 쓰는 이름이면 그 비밀번호로 계정이 만들어집니다.</div>

<!-- 들어간 뒤에 보이는 대화 화면 -->
<div id="chat" class="hidden">
  <div id="messages"></div>
  <form id="sendForm">
    <input id="body" placeholder="메시지 입력" autocomplete="off">
    <button>보내기</button>
  </form>
</div>

<script>
const $ = (id) => document.getElementById(id);
let ws;

// 로그인 화면으로 돌아간다.
function showLogin(message) {
  $('status').textContent = message;
  $('loginForm').classList.remove('hidden');
  $('hint').classList.remove('hidden');
  $('chat').classList.add('hidden');
}

// 이름과 비밀번호를 서버에 보내 확인받는다. 맞으면 서버가 입장권(token)을 준다.
$('loginForm').onsubmit = async (event) => {
  event.preventDefault();
  const response = await fetch('/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name: $('name').value.trim(), password: $('password').value }),
  });
  const result = await response.json();
  $('password').value = '';
  if (!response.ok) {
    $('status').textContent = result.error;
    return;
  }
  // 입장권을 이 탭에 보관한다. 새로고침해도 남고, 탭을 닫으면 사라진다.
  // 비밀번호는 보관하지 않는다. 이 뒤로는 입장권만 쓴다.
  sessionStorage.setItem('token', result.token);
  sessionStorage.setItem('name', result.name);
  connect();
};

// 보관해 둔 입장권으로 서버에 WebSocket 접속을 한다. 입장권은 주소 뒤에 붙여 보낸다.
function connect() {
  const token = sessionStorage.getItem('token');
  const name = sessionStorage.getItem('name');
  let opened = false;

  ws = new WebSocket(`ws://${location.host}/ws?token=${encodeURIComponent(token)}`);

  // 연결되면 대화 화면으로 바꾼다.
  ws.onopen = () => {
    opened = true;
    $('status').textContent = `${name} (으)로 연결됨`;
    $('loginForm').classList.add('hidden');
    $('hint').classList.add('hidden');
    $('chat').classList.remove('hidden');
    $('messages').replaceChildren();
    $('body').focus();
  };

  // 서버가 메시지를 보내 줄 때마다 화면에 한 줄 추가한다.
  // 메시지는 {"seq": 순번, "name": 보낸 사람, "body": 내용} 모양의 JSON 이다.
  // 순번은 DB 가 매긴 번호다. 서버가 보내 준 순서가 아니라 이 번호를 믿는다.
  ws.onmessage = (event) => {
    const message = JSON.parse(event.data);

    // 같은 순번을 이미 그렸으면 버린다. (접속하는 순간에는 같은 메시지가 두 번 올 수 있다)
    if ($('m' + message.seq)) return;

    const row = document.createElement('div');
    row.id = 'm' + message.seq;
    row.dataset.seq = message.seq;
    const seq = document.createElement('span');
    seq.className = 'seq';
    seq.textContent = '#' + message.seq + ' ';
    const who = document.createElement('span');
    who.className = 'who';
    who.textContent = message.name + ': ';
    row.append(seq, who, message.body);

    // 순번이 더 큰 줄이 이미 있으면 그 앞에 끼워 넣는다. 없으면 맨 아래에 붙인다.
    // (두 사람이 동시에 보내면 순번이 큰 쪽이 먼저 도착할 수 있다)
    const later = [...$('messages').children].find((other) => Number(other.dataset.seq) > message.seq);
    $('messages').insertBefore(row, later ?? null);
    $('messages').scrollTop = $('messages').scrollHeight;
  };

  // 연결이 끊기면 알려 준다. (아직 자동 재접속이 없다)
  ws.onclose = () => {
    if (opened) {
      $('status').textContent = '연결 끊김. 새로고침하면 다시 접속합니다';
    } else {
      // 한 번도 연결되지 못했다: 서버가 입장권을 받아 주지 않은 것이다.
      // 입장권을 버리고 다시 로그인하게 한다.
      sessionStorage.clear();
      showLogin('다시 로그인해 주세요');
    }
  };
}

// 페이지를 열었을 때 보관해 둔 입장권이 있으면 로그인 없이 바로 접속한다.
if (sessionStorage.getItem('token')) connect();

// 보내기를 누르면 입력한 글을 서버로 보낸다.
$('sendForm').onsubmit = (event) => {
  event.preventDefault();
  const body = $('body').value.trim();
  if (!body || ws.readyState !== WebSocket.OPEN) return;
  ws.send(body);
  $('body').value = '';
};
</script>
</body>
</html>
