[workspace]
resolver = "2"
members = [
    "crates/common",
    "crates/gateway",
    "crates/chat-service",
    "crates/persist-worker",
    "crates/push-worker",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
common = { path = "crates/common" }

anyhow = "1"
async-nats = "0.38"
axum = { version = "0.7", features = ["ws"] }
futures-util = "0.3"
jsonwebtoken = "9"
prost = "0.13"
rdkafka = "0.36"
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }
scylla = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres"] }
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
tonic = "0.12"
tonic-build = "0.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "thin"
strip = true
