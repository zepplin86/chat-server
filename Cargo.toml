[package]
name = "chat-server"
version = "0.1.0"
edition = "2021"

[dependencies]
# 웹 서버. "ws" 기능을 켜야 WebSocket 을 쓸 수 있다.
axum = { version = "0.7", features = ["ws"] }
# WebSocket 을 읽기/쓰기로 나누고 다루는 데 쓴다.
futures-util = "0.3"
# 주소 뒤의 값(?name=...)을 읽고, 메시지를 JSON 으로 만드는 데 쓴다.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 비동기 실행 환경.
tokio = { version = "1", features = ["full"] }
