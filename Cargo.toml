[package]
name = "chat-server"
version = "0.1.0"
edition = "2021"

[dependencies]
# 웹 서버. "ws" 기능을 켜야 WebSocket 을 쓸 수 있다.
axum = { version = "0.7", features = ["ws"] }
# ScyllaDB 에 접속해 메시지를 넣고 읽는 라이브러리.
scylla = "1"
# 주소 뒤의 값(?token=...)과 로그인 요청을 읽고, 메시지를 JSON 으로 만드는 데 쓴다.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 비밀번호를 되돌릴 수 없는 모양(해시)으로 바꾸는 라이브러리.
argon2 = "0.5"
# NATS 에 접속해 메시지를 내보내고 받는 라이브러리. (서버들 사이의 전달)
async-nats = "0.53"
# NATS 에서 오는 메시지를 하나씩 꺼낼 때 쓰는 next() 가 여기 들어 있다.
futures-util = "0.3"
# 약속 파일(proto)에 적은 메시지를 바이트로 바꾸고 되돌리는 라이브러리. gRPC 가 속에서 쓴다.
prost = "0.14"
# Kafka 에 접속해 기록을 적고 읽는 라이브러리. C 로 된 원본(librdkafka)을 함께 빌드한다.
# 그래서 처음 빌드가 몇 분 걸리고, cmake 가 깔려 있어야 한다. (없으면: brew install cmake)
rdkafka = { version = "0.36", features = ["cmake-build"] }
# PostgreSQL 에 접속해 SQL 을 보내는 라이브러리.
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres"] }
# 비동기 실행 환경.
tokio = { version = "1", features = ["full"] }
# gRPC 라이브러리. 게이트웨이가 채팅 서버의 함수를 부를 때 쓴다.
tonic = "0.14"
# tonic 과 prost 를 이어 주는 라이브러리.
tonic-prost = "0.14"

# 빌드하기 전에 도는 build.rs 가 쓰는 라이브러리.
[build-dependencies]
# proto/chat.proto 를 읽어 Rust 코드로 만들어 준다.
tonic-prost-build = "0.14"
