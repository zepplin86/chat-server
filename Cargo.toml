[package]
name = "chat-server"
version = "0.1.0"
edition = "2021"

[dependencies]
# 웹 서버. "ws" 기능을 켜야 WebSocket 을 쓸 수 있다.
axum = { version = "0.7", features = ["ws"] }
# 주소 뒤의 값(?token=...)과 로그인 요청을 읽고, 메시지를 JSON 으로 만드는 데 쓴다.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 비밀번호를 되돌릴 수 없는 모양(해시)으로 바꾸는 라이브러리.
argon2 = "0.5"
# PostgreSQL 에 접속해 SQL 을 보내는 라이브러리.
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres"] }
# 비동기 실행 환경.
tokio = { version = "1", features = ["full"] }
