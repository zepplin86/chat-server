<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -25 960 960" width="960" height="960" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/>
    </marker>
  </defs>

  <rect y="-25" width="960" height="960" fill="#ffffff"/>

  <!-- 사용자 앱 -->
  <rect x="180" y="30" width="300" height="60" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
  <text x="330" y="67" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">사용자 앱</text>

  <line x1="330" y1="90" x2="330" y2="138" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="345" y="112" font-size="14" fill="#475569">WebSocket</text>
  <text x="345" y="130" font-size="12" fill="#64748b">한 번 연결하면 계속 열려 있는 통로</text>

  <!-- 로드밸런서 -->
  <rect x="180" y="140" width="300" height="60" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
  <text x="330" y="166" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">로드밸런서</text>
  <text x="330" y="187" text-anchor="middle" font-size="13" fill="#475569">접속을 여러 서버에 골고루 나눠줌</text>

  <line x1="330" y1="200" x2="330" y2="248" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 게이트웨이 -->
  <rect x="180" y="250" width="300" height="80" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="330" y="283" text-anchor="middle" font-size="20" font-weight="700" fill="#1e3a8a">게이트웨이 서버 (여러 대)</text>
  <text x="330" y="309" text-anchor="middle" font-size="14" fill="#1e40af">사용자 연결을 붙잡고 있음</text>

  <line x1="330" y1="330" x2="330" y2="388" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="345" y="364" font-size="14" fill="#475569">메시지 넘김</text>

  <!-- 채팅 서버 -->
  <rect x="180" y="390" width="300" height="100" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="330" y="423" text-anchor="middle" font-size="20" font-weight="700" fill="#14532d">채팅 서버 (여러 대)</text>
  <text x="330" y="450" text-anchor="middle" font-size="14" fill="#166534">① 보내도 되는지 검사</text>
  <text x="330" y="472" text-anchor="middle" font-size="14" fill="#166534">② 메시지에 번호 붙이기</text>

  <!-- 채팅 → NATS -->
  <line x1="480" y1="440" x2="638" y2="440" stroke="#c2410c" stroke-width="2" marker-end="url(#arrowOrange)"/>
  <text x="559" y="430" text-anchor="middle" font-size="14" fill="#c2410c">③ 실시간 전달</text>

  <!-- NATS -->
  <rect x="640" y="400" width="280" height="80" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  <text x="780" y="433" text-anchor="middle" font-size="19" font-weight="700" fill="#7c2d12">실시간 전달 통로</text>
  <text x="780" y="459" text-anchor="middle" font-size="14" fill="#9a3412">NATS · 빠름, 가끔 놓칠 수 있음</text>

  <!-- NATS → 게이트웨이 -->
  <path d="M780,400 L780,290 L482,290" fill="none" stroke="#c2410c" stroke-width="2" marker-end="url(#arrowOrange)"/>
  <text x="635" y="280" text-anchor="middle" font-size="14" fill="#c2410c">④ 받는 사람에게 전달</text>

  <!-- 채팅 → Kafka -->
  <line x1="330" y1="490" x2="330" y2="558" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="345" y="529" font-size="14" fill="#475569">③ 기록</text>

  <!-- Kafka -->
  <rect x="180" y="560" width="300" height="80" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="330" y="593" text-anchor="middle" font-size="19" font-weight="700" fill="#4c1d95">기록 통로</text>
  <text x="330" y="619" text-anchor="middle" font-size="14" fill="#5b21b6">Kafka · 순서대로 적고 사라지지 않음</text>

  <!-- Kafka → 담당들 -->
  <line x1="255" y1="640" x2="190" y2="698" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="405" y1="640" x2="470" y2="698" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="70" y="700" width="230" height="60" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
  <text x="185" y="737" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">저장 담당</text>

  <rect x="360" y="700" width="230" height="60" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
  <text x="475" y="737" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">푸시 담당</text>

  <line x1="185" y1="760" x2="185" y2="808" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="475" y1="760" x2="475" y2="808" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="70" y="810" width="230" height="70" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
  <text x="185" y="840" text-anchor="middle" font-size="18" font-weight="700" fill="#713f12">메시지 DB</text>
  <text x="185" y="863" text-anchor="middle" font-size="13" fill="#854d0e">ScyllaDB</text>

  <rect x="360" y="810" width="230" height="70" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
  <text x="475" y="840" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">휴대폰 알림</text>
  <text x="475" y="863" text-anchor="middle" font-size="13" fill="#475569">APNs / FCM</text>

  <!-- 보조 저장소 -->
  <path d="M480,478 L655,575" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
  <text x="590" y="520" font-size="13" fill="#64748b">조회 · 저장</text>

  <rect x="640" y="570" width="280" height="310" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="780" y="602" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">보조 저장소</text>

  <rect x="660" y="620" width="240" height="72" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="780" y="647" text-anchor="middle" font-size="16" font-weight="700" fill="#7f1d1d">Redis</text>
  <text x="780" y="667" text-anchor="middle" font-size="12" fill="#991b1b">누가 접속 중인지 · 방별 메시지 번호</text>
  <text x="780" y="683" text-anchor="middle" font-size="12" fill="#991b1b">최근 메시지</text>

  <rect x="660" y="704" width="240" height="72" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="780" y="734" text-anchor="middle" font-size="16" font-weight="700" fill="#0c4a6e">PostgreSQL</text>
  <text x="780" y="757" text-anchor="middle" font-size="12" fill="#075985">사용자 · 방 · 방 멤버 정보</text>

  <rect x="660" y="788" width="240" height="72" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="780" y="818" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">파일 저장소</text>
  <text x="780" y="841" text-anchor="middle" font-size="12" fill="#475569">사진 · 파일 (채팅에는 주소만 오감)</text>
</svg>
